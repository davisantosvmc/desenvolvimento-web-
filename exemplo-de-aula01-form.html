<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario do Estudante</title>
</head>
<body>
    <h1>Cadastro do Estudante</h1>
     <form>
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="digite o nome do estudante ou responsavel" required/>
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="email" required/>
        </p>
        <p>
            <label for="email">RGM:</label>
            <input type="text" id="RGM" name="RGM" placeholder="rajada de glock matadora" required/>
        </p>
        <p>
            <label for="email">Senha:</label>
            <input type="text" id="Senha" name="Senha" placeholder="xxxx@000-0000" required/>
        </p>
        <p>
            <label for="email">Aura:</label>
            <input type="text" id="Aura" name="Aura" placeholder="tamanho da aura" required/>
        </p>
        <button type="submit">Enviar</button>
        <button type="reset">Eliminar</button>









     </form>
</body> 
</html>
