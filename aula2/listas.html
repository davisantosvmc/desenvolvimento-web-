<!DOCTYPE html>
<html lang="en">
<head>

    <title>Elementos de listas </title>
    <p>
        As listas em HTML são utilizadas para organiizar
        informações em uma sequencia. 
    </p>
    <h2>Listas nao ordenadas</h2>
    <ul>
         <li>Item 1</li>
         <li>Item 2</li>
         <li>Item 3</li>
         <li>Item 4</li>
    <h2>Listas ordenadas</h2>
    <ol>
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item</li>
    </ol>

    </ul>
</head>
